{% extends 'main/common.html' %}


{% block content %}
<style>
 .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        form input, form select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #bbb;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .errorlist {
            background: #ffdddd;
            padding: 10px;
            border-left: 4px solid red;
            margin-bottom: 10px;
            color: #a00;
        }
    </style>


<div class="container">
    <h2>Registrazione Studente</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Errori generali -->
        {{ form.non_field_errors }}

        <!-- Django renderizzerà automaticamente tutti i campi -->
        {% for field in form %}
            <label>{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
                <div class="errorlist">{{ error }}</div>
            {% endfor %}
        {% endfor %}

        <button type="submit">Registrati</button>
    </form>
</div>
{% endblock %}
